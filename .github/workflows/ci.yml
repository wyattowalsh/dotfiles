name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install just
        uses: extractions/setup-just@v3
        with:
          just-version: 1.39.0

      - name: Set up system validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Run CI validation
        run: just ci
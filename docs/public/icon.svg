    <circle cx="118" cy="90" r="4.5" fill="#2B80FF"/>

    <path d="M91 123L117 145L91 167" stroke="url(#glyphDark)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M139 157H165" stroke="url(#glyphDark)" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g class="light">
    <path d="M128 18L206 63V193L128 238L50 193V63L128 18Z" fill="#EEF4FB" stroke="#D6E2EE" stroke-width="10" stroke-linejoin="round"/>
    <path d="M128 30L194 69V187L128 226L62 187V69L128 30Z" fill="#FFFFFF" stroke="#D7E3EF" stroke-width="4" stroke-linejoin="round"/>

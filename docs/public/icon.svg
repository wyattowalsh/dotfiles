    <path d="M128 30L194 69V187L128 226L62 187V69L128 30Z" stroke="url(#accentDark)" stroke-width="7" stroke-linejoin="round"/>

    <path d="M81 74H161L182 95V170C182 179.941 173.941 188 164 188H92C82.059 188 74 179.941 74 170V81C74 77.134 77.134 74 81 74Z" fill="#071120" stroke="#15243A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M81 74H161L182 95V170C182 179.941 173.941 188 164 188H92C82.059 188 74 179.941 74 170V81C74 77.134 77.134 74 81 74Z" stroke="url(#accentDark)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M161 74V89C161 92.314 163.686 95 167 95H182" stroke="#2A4C73" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M74 106H182" stroke="#28486E" stroke-width="3"/>


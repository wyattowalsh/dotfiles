<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dotfiles icon</title>
  <desc id="desc">A minimal theme-aware SVG icon for the dotfiles project. It shows a hexagonal badge containing a file-like panel with three dots and a terminal prompt.</desc>
  <style>
    .light { display: none; }
    .dark { display: inline; }
    @media (prefers-color-scheme: light) {
      .light { display: inline; }
      .dark { display: none; }
    }
  </style>

  <defs>
    <linearGradient id="accentDark" x1="48" y1="40" x2="208" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26E2C6"/>
      <stop offset="1" stop-color="#2B80FF"/>
    </linearGradient>
    <linearGradient id="accentLight" x1="48" y1="40" x2="208" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17C9B2"/>
      <stop offset="1" stop-color="#246FFF"/>
    </linearGradient>
    <linearGradient id="glyphDark" x1="84" y1="102" x2="164" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27E2C3"/>
      <stop offset="1" stop-color="#2DA3FF"/>
    </linearGradient>
    <linearGradient id="glyphLight" x1="84" y1="102" x2="164" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14D0A8"/>
      <stop offset="1" stop-color="#228EFF"/>
    </linearGradient>
  </defs>


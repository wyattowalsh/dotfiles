gui:
  showFileTree: true
  showCommandLog: false
git:
  paging:
    # delta --dark is pager contrast, independent of Ghostty's light theme.
    pager: delta --dark --paging=never
customCommands:
  - key: '<c-o>'
    context: 'commits'
    command: 'gh browse {{.SelectedLocalCommit.Hash}}'
    description: 'Open commit in GitHub'

# IINA user-defined mpv config. Loaded only while IINA's "Use config
# directory" preference is enabled. IINA passes this directory to mpv as its
# config dir, so `~~/shaders/...` in IINA-Native.conf resolves here.
#
# Shader chains are opt-in at runtime; nothing is forced globally. IINA's own
# preference-derived options remain authoritative for playback/render settings.

# Local-only Atuin. Do not commit ~/.local/share/atuin/{history.db,key,session}.
# Ctrl-R is Atuin (host → session → directory → workspace → global).
# Up-arrow stays native zsh; Atuin AI keybinding is disabled in zshrc.

auto_sync = false
update_check = false
secrets_filter = true
store_failed = true
workspaces = true
filter_mode = "host"
search_mode = "daemon-fuzzy"
style = "compact"
inline_height = 20
enter_accept = true
show_preview = true
keymap_mode = "emacs"
ctrl_n_shortcuts = true

# Extra exclusions beyond the built-in secrets_filter (literals only; no secret values).
history_filter = [
  "^op login",
  "^op item ",
  "security find-password",
  "security find-generic-password",
  "security find-internet-password",
]

[ai]
enabled = false

[search]
filters = ["host", "session", "directory", "workspace", "global"]

[daemon]
enabled = true
autostart = true

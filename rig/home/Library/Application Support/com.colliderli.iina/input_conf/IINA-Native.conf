# Curated native IINA/mpv profile — not a dump of mpv defaults.
# Meta is Command. IINA-only commands use #@iina; mpv commands stay unprefixed
# so screenshot/ab-loop wrappers run. Pointer zoom/presets are deferred to
# cursor-actions.md; this profile does not depend on a plugin or Hammerspoon.

# Seeks — 10s responsive (relative+keyframes); 5s/1s no-osd relative+exact
LEFT             seek -10 relative+keyframes
RIGHT            seek  10 relative+keyframes
a                seek -10 relative+keyframes
d                seek  10 relative+keyframes

Shift+LEFT       no-osd seek -5 relative+exact
Shift+RIGHT      no-osd seek  5 relative+exact
Shift+a          no-osd seek -5 relative+exact
Shift+d          no-osd seek  5 relative+exact

Shift+Meta+LEFT  no-osd seek -1 relative+exact
Shift+Meta+RIGHT no-osd seek  1 relative+exact
Shift+Meta+a     no-osd seek -1 relative+exact
Shift+Meta+d     no-osd seek  1 relative+exact

# Play
SPACE            cycle pause
p                cycle pause
,                frame-back-step
.                frame-step

# OSD readouts
o                show-text "${time-pos:%H:%M:%S} / ${duration:%H:%M:%S} (${percent-pos}%)"
Shift+o          show-text "${media-title}"

# Playlist / chapters (PageDown = next chapter)
Meta+LEFT        playlist-prev
Meta+RIGHT       playlist-next
PGDWN            add chapter 1
PGUP             add chapter -1
Ctrl+p           playlist-shuffle

# Volume
DOWN             add volume -5
UP               add volume 5
Alt+DOWN         add volume -1
Alt+UP           add volume 1
m                cycle mute

# Unmodified wheel pans via mpv when IINA scroll actions pass through to mpv.
# The old Command+scroll pointer zoom is not part of this native profile.
WHEEL_UP         add video-pan-y  0.04
WHEEL_DOWN       add video-pan-y -0.04
WHEEL_LEFT       add video-pan-x -0.04
WHEEL_RIGHT      add video-pan-x  0.04

# Speed
[                multiply speed 1/1.1
]                multiply speed 1.1
{                multiply speed 0.5
}                multiply speed 2.0
BS               set speed 1.0

# Subtitles
v                cycle sub-visibility
Alt+v            cycle secondary-sub-visibility
j                cycle sub
J                cycle sub down
Ctrl+LEFT        sub-seek -1
Ctrl+RIGHT       sub-seek 1
z                add sub-delay -0.1
x                add sub-delay 0.1
c                set sub-delay 0
F                add sub-scale -0.1
G                add sub-scale 0.1
r                add sub-pos -1
R                add sub-pos 1

# Audio
Ctrl+-           add audio-delay -0.1
Ctrl+=           add audio-delay 0.1
Ctrl+0           set audio-delay 0
SHARP            cycle audio

# Display
f                cycle fullscreen
ESC              set fullscreen no
T                cycle ontop
i                script-binding stats/display-stats
I                script-binding stats/display-stats-toggle
b                cycle deband
w                add panscan -0.1
W                add panscan 0.1
Alt+a            cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"
Alt+d            cycle deinterlace

# Image adjust — deliberate Ctrl+digit control; plain digits stay ignored below
Ctrl+1           add brightness 5
Ctrl+2           add brightness -5
Ctrl+3           add contrast 5
Ctrl+4           add contrast -5
Ctrl+5           add gamma 5
Ctrl+6           add gamma -5
Ctrl+7           add saturation 5
Ctrl+8           add saturation -5

# Opt-in upscaling shaders (pinned by shaders-pin.json; Unix path lists use ":")
Ctrl+u            no-osd change-list glsl-shaders clr "" ; show-text "Upscaling shaders: off"
Meta+u            no-osd change-list glsl-shaders set "~~/shaders/FSRCNNX_x2_16-0-4-1.glsl" ; show-text "FSRCNNX: quality"
Shift+Meta+u      no-osd change-list glsl-shaders set "~~/shaders/FSRCNNX_x2_8-0-4-1.glsl" ; show-text "FSRCNNX: fast"
Alt+1             no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl" ; show-text "Anime4K: Mode A (fast)"
Alt+2             no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl" ; show-text "Anime4K: Mode B (fast)"
Alt+3             no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl" ; show-text "Anime4K: Mode C (fast)"
Shift+Alt+1       no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl" ; show-text "Anime4K: Mode A (HQ)"
Shift+Alt+2       no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl" ; show-text "Anime4K: Mode B (HQ)"
Shift+Alt+3       no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl" ; show-text "Anime4K: Mode C (HQ)"

# Screenshots (unprefixed so IINA wrappers run)
s                screenshot
S                screenshot video
Ctrl+s           screenshot window
Meta+s           screenshot

# Loop (unprefixed so IINA wrappers run)
l                ab-loop
L                cycle-values loop "inf" "no"
Meta+l           ab-loop

# IINA panels / chrome
#@iina Alt+Meta+v video-panel
#@iina Alt+Meta+a audio-panel
#@iina Alt+Meta+s sub-panel
#@iina Alt+Meta+p playlist-panel
#@iina Alt+Meta+c chapter-panel
#@iina Alt+Meta+f find-online-subs
#@iina Ctrl+Meta+p toggle-pip
#@iina Alt+Meta+m toggle-music-mode
#@iina Shift+Meta+r show-current-file-in-finder

# Hazards — neutralize mpv quit / burst-screenshot / decoder / image-adjust
q                ignore
Q                ignore
Ctrl+c           ignore
Ctrl+w           ignore
Alt+s            ignore
Ctrl+h           ignore
1                ignore
2                ignore
3                ignore
4                ignore
5                ignore
6                ignore
7                ignore
8                ignore

# No private F-key bridge; cursor controls are separate future work.
